<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate of Achievement</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            padding: 20px;
        }
        .certificate-container {
            background: white;
            color: black;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            margin: auto;
            text-align: center;
            border: 5px solid gold;
        }
        h1 {
            font-size: 36px;
            color: #1e3c72;
        }
        p {
            font-size: 20px;
            margin: 10px 0;
        }
        .bold-text {
            font-weight: bold;
        }
        .download-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: gold;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .signature {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding: 0 40px;
        }
        .signature div {
            text-align: center;
        }
        .certificate-date {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="certificate" class="certificate-container">
        <h1>Certificate of Achievement</h1>
        <p>This certificate is proudly presented to:</p>
        <p class="bold-text" id="participant-name">[Name]</p>
        <p>For successfully completing the <span class="bold-text">Advanced Graphics Design Quiz</span></p>
        <p>with an excellent score of <span class="bold-text" id="quiz-score">[Score]</span>.</p>
        <p class="certificate-date" id="current-date"></p>

        <div class="signature">
            <div>
                <p>________________</p>
                <p>Instructor</p>
            </div>
            <div>
                <p>________________</p>
                <p>Director</p>
            </div>
        </div>
    </div>

    <button class="download-btn" onclick="generatePDF()">Download Certificate</button>

    <script>
        // Fetch user details from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get("email");

        async function fetchParticipantDetails(email) {
            try {
                const response = await fetch(`/getProfile?email=${email}`);
                if (!response.ok) {
                    throw new Error("Failed to fetch participant details");
                }
                const data = await response.json();
                return data.student;
            } catch (error) {
                console.error("Error fetching participant details:", error);
                return null;
            }
        }

        async function displayCertificate() {
            const participant = await fetchParticipantDetails(email);
            if (participant) {
                document.getElementById("participant-name").innerText = participant.name;
                document.getElementById("quiz-score").innerText = localStorage.getItem("quizScore");
                document.getElementById("current-date").innerText = "Date: " + new Date().toLocaleDateString();
            } else {
                document.getElementById("participant-name").innerText = "Participant details not found.";
            }
        }

        displayCertificate();

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF("landscape");

            const element = document.getElementById("certificate");

            html2canvas(element, { scale: 2 }).then(canvas => {
                const imgData = canvas.toDataURL("image/png");
                pdf.addImage(imgData, "PNG", 20, 20, 250, 150);
                pdf.save("Certificate.pdf");

                sendEmail(imgData);
            });
        }

        async function sendEmail(pdfData) {
            const response = await fetch("/sendCertificate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, pdfData })
            });

            if (response.ok) {
                alert("Certificate sent to email!");
            } else {
                alert("Failed to send certificate.");
            }
        }
    </script>
</body>
</html>
