<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for Job</title>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(150deg, #1a6fb4, #11d2b5);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .form-container {
      max-width: 450px;
      width: 100%;
      background: #f8f9fa;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 30px;
      box-sizing: border-box;
      text-align: left;
    }
    .form-container h2 {
      font-size: 24px;
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-container label {
      font-weight: 500;
      margin-bottom: 6px;
      display: block;
      color: #000;
    }
    .form-container input,
    .form-container button {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    .form-container input:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }
    .form-container button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
    .form-container button:hover {
      background-color: #0056b3;
      box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
    }
    .form-container button:active {
      background-color: #004494;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Apply for Job</h2>
    <form id="jobApplicationForm" action="/apply" method="POST" enctype="multipart/form-data">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email address" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

      <label for="experience">Years of Experience</label>
      <input type="number" id="experience" name="experience" placeholder="Enter your years of experience" required>

      <label for="resume">Upload Resume</label>
      <input type="file" id="resume" name="resume" accept=".jpg, .jpeg, .png, .pdf" required>

      <button type="submit">Submit Application</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const form = document.getElementById("jobApplicationForm");

      form.addEventListener("submit", function (event) {
        event.preventDefault(); // Prevent default form submission

        // Create FormData object
        const formData = new FormData(form);

        // Submit form data to the backend
        fetch("/apply", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              alert("Application submitted successfully!");
              form.reset(); // Reset the form
            } else {
              alert("Error submitting application.");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("Error submitting application.");
          });
      });
    });
  </script>
</body>
</html>
