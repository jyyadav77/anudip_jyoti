<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - College Placement System</title>
    <link rel="stylesheet" href="reg.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="register-box">
        <h1>Create Your Account</h1>
        <form id="registerForm">
          <div class="input-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              required
              pattern="[A-Za-z\s]{1,32}"
              title="Full name should only contain alphabets and spaces, with a maximum of 32 characters."
              maxlength="32"
            />
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="input-group">
            <label for="contact">Contact Number</label>
            <input
              type="text"
              id="contact"
              name="contact"
              placeholder="Enter your contact number"
              required
              pattern="[0-9]{10}"
              title="Contact number must be exactly 10 digits."
              maxlength="10"
            />
          </div>

          <div class="input-group">
            <label for="password">Create Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
              title="Password must be 8-12 characters long, include at least one uppercase letter, one lowercase letter, one number, and one special character (@, #, $, %, ^, &, +, =)"
              minlength="8"
              maxlength="12"
            />
          </div>

          <div class="input-group">
            <label for="cp">Confirm Password</label>
            <input
              type="password"
              id="cp"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
              title="Password must be 8-12 characters long, include at least one uppercase letter, one lowercase letter, one number, and one special character (@, #, $, %, ^, &, +, =)"
              minlength="8"
              maxlength="12"
            />
          </div>

          <button type="submit" class="register-btn">Register</button>

          <p>
            Already have an account?
            <a href="login.html">Login</a>
          </p>
        </form>
      </div>
    </div>

    <script>
      document.getElementById("registerForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        // Get form values
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const contact = document.getElementById("contact").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("cp").value;

        // Prepare data for sending
        const data = {
          name,
          email,
          contact,
          password,
          confirmPassword,
        };

        try {
          const response = await fetch("/REGIS", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          if (response.ok) {
            alert(result.message);  // Registration success
          } else {
            alert(result.message);  // Registration error
          }
        } catch (error) {
          console.error("Error during registration:", error);
          alert("Something went wrong. Please try again.");
        }
      });
    </script>
  </body>
</html>
